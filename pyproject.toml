[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenRbac"
version = "1.0.5"
description = "OpenRbac is online RBAC and centralized configuration for the terminal and a local web page."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Wong Chun Fai", email = "cloudgen.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "RBAC", "configuration"]

dependencies = [
    "ChronicleLogger>=1.3.1",
    "PyMySQL>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/cloudgen/OpenRbac"
Repository = "https://github.com/cloudgen/OpenRbac"
Issues = "https://github.com/cloudgen/OpenRbac/issues"

[project.scripts]
open-rbac = "OpenRbac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
OpenRbac = ["templates/*.vue", "element_plus/*.css", "element_plus/*.js", "element_plus/themes/*.css", "element_plus/LICENSE", "element_plus/icons/*.svg"]
